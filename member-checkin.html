<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Member Check-In | OD Club</title>
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Firebase Setup -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "surface-container": "#1f1f1f", "on-primary": "#551e29", "surface-bright": "#393939",
                "on-error": "#690005", "surface-container-low": "#1b1b1b", "inverse-on-surface": "#303030",
                "on-surface": "#e2e2e2", "inverse-surface": "#e2e2e2", "surface-dim": "#131313",
                "outline-variant": "#524345", "surface-tint": "#ffb2bc", "surface-container-highest": "#353535",
                "on-surface-variant": "#d7c1c3", "tertiary": "#98d4a8", "on-background": "#e2e2e2",
                "outline": "#9f8c8e", "surface-variant": "#353535", "error": "#ffb4ab",
                "surface": "#131313", "primary": "#ffb2bc", "surface-container-high": "#2a2a2a",
                "background": "#131313", "error-container": "#93000a", "surface-container-lowest": "#0e0e0e"
              },
              "fontFamily": {
                "label-md": ["Inter"], "headline-md": ["Oswald"], "body-md": ["Inter"], "headline-lg": ["Oswald"]
              }
            }
          }
        }
    </script>
    <style>
        body { background-color: #131313; color: #e2e2e2; min-height: 100dvh; display: flex; flex-direction: column; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }
        .glow-primary { box-shadow: 0 0 15px rgba(255, 178, 188, 0.3); }
        #qr-canvas { margin: 0 auto; border-radius: 8px; border: 8px solid white; }
    </style>
</head>
<body class="font-body-md overflow-x-hidden">

    <!-- SECTION 1 - HEADER -->
    <header class="bg-background fixed top-0 left-0 w-full z-50 border-b border-outline-variant/30">
        <div class="flex flex-col justify-center items-center py-3 w-full">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary text-3xl">workspace_premium</span>
                <h1 class="font-headline-lg text-2xl tracking-wider text-primary uppercase">OD Club</h1>
            </div>
            <p class="text-on-surface-variant text-sm font-label-md mt-1 uppercase tracking-widest">Member Check-In Portal</p>
        </div>
    </header>

    <main class="pt-28 pb-12 flex-grow flex items-center justify-center px-4">
        <div class="bg-surface-container border border-outline-variant/30 rounded-2xl p-6 w-full max-w-md shadow-2xl relative overflow-hidden">
            <div class="absolute inset-0 pointer-events-none opacity-10 bg-[url('https://lh3.googleusercontent.com/aida-public/AB6AXuDglD7Dwdr6hs-yJ71lAUb1O4ISzuBnJzO722WaUUJQHc9OwpX3Voh915eplCa1rZcFQMUKfI9_ebonizdYTO19wM9JPrKdQHqSgRhU36EaXitjEwXH5quZ9-HqWE4_KfPficVZXJxn3ZbPGytvio0qCGEUg861gDBJe1eX6FXiBtwk9zXMBJ6qXYJDrsOABBg-oSzXijAmfGfcUnU87x3kntcTmjc3OQJKKbk_-q9ucNzuV2vd0QpM95qV9vkLw94bThCdnPSgKP0')] bg-cover mix-blend-overlay"></div>
            
            <div class="relative z-10 text-center">
                
                <div id="error-alert" class="hidden mb-6 p-4 rounded bg-error-container text-on-error-container font-medium text-sm text-center"></div>

                <!-- SECTION 2 - TWO BIG BUTTONS -->
                <div id="section-buttons" class="space-y-4">
                    <button onclick="selectZone('gym')" class="w-full bg-surface-container-highest border border-outline-variant/50 text-on-surface font-headline-md text-xl py-6 rounded-xl hover:bg-surface-bright transition-all flex items-center justify-center gap-3">
                        <span class="material-symbols-outlined text-3xl text-primary">fitness_center</span> Gym Check-In
                    </button>
                    <button onclick="selectZone('gamezone')" class="w-full bg-surface-container-highest border border-outline-variant/50 text-on-surface font-headline-md text-xl py-6 rounded-xl hover:bg-surface-bright transition-all flex items-center justify-center gap-3">
                        <span class="material-symbols-outlined text-3xl text-primary">sports_esports</span> Game Zone Check-In
                    </button>
                </div>

                <!-- SECTION 3 - MEMBER ID INPUT -->
                <div id="section-input" class="hidden space-y-6">
                    <button onclick="resetPage()" class="text-primary text-sm flex items-center gap-1 hover:underline mb-4 mx-auto">
                        <span class="material-symbols-outlined text-sm">arrow_back</span> Back
                    </button>
                    <h3 id="zone-title" class="font-headline-md text-2xl text-primary uppercase tracking-widest mb-4">--</h3>
                    
                    <form id="checkin-form" class="space-y-4 text-left">
                        <div>
                            <input type="text" id="member-id" required placeholder="Enter Your Member ID"
                                   class="w-full bg-surface-container-lowest border border-outline-variant/50 rounded-lg px-4 py-4 text-on-surface focus:border-primary outline-none text-center text-xl uppercase tracking-wider font-headline-md">
                        </div>
                        <button type="submit" id="btn-submit" class="w-full mt-4 bg-primary text-on-primary font-headline-md text-xl py-4 rounded-lg uppercase tracking-wider hover:brightness-110 glow-primary transition-all">
                            Proceed
                        </button>
                    </form>
                </div>

                <!-- SECTION 4 - QR CODE DISPLAY -->
                <div id="section-qr" class="hidden space-y-4 flex flex-col items-center">
                    <h3 class="font-headline-md text-xl text-primary uppercase">Scan QR with your phone</h3>
                    <p id="member-name-display" class="text-on-surface text-lg font-headline-md uppercase tracking-wide"></p>
                    
                    <div class="my-4 bg-white p-2 rounded-xl inline-block shadow-lg">
                        <canvas id="qr-canvas"></canvas>
                    </div>
                    
                    <div class="flex items-center gap-3 text-on-surface-variant bg-surface-container-lowest py-3 px-6 rounded-full border border-outline-variant/30">
                        <span class="material-symbols-outlined animate-spin text-primary">sync</span>
                        <span id="qr-status-msg" class="text-sm font-medium">Waiting for photo upload...</span>
                    </div>

                    <p id="countdown-timer" class="text-error font-headline-md text-lg mt-2">QR expires in: 4:59</p>

                    <button onclick="resetPage()" class="text-on-surface-variant text-sm hover:text-error mt-4 transition-colors">Cancel Request</button>
                </div>

                <!-- SUCCESS / REJECTED STATES -->
                <div id="section-success" class="hidden space-y-6 flex flex-col items-center py-8">
                    <span class="material-symbols-outlined text-6xl text-tertiary mb-2">check_circle</span>
                    <h3 class="font-headline-md text-3xl text-tertiary uppercase">Entry Confirmed!</h3>
                    <p id="success-message" class="text-on-surface-variant text-lg">Welcome</p>
                </div>

                <div id="section-rejected" class="hidden space-y-6 flex flex-col items-center py-8">
                    <span class="material-symbols-outlined text-6xl text-error mb-2">cancel</span>
                    <h3 class="font-headline-md text-3xl text-error uppercase">Entry Rejected</h3>
                    <p class="text-on-surface-variant text-lg">By Admin. Please contact reception.</p>
                    <button onclick="resetPage()" class="mt-8 bg-surface-container-highest border border-outline-variant/50 px-8 py-3 rounded-lg hover:bg-surface-bright transition-all">Restart</button>
                </div>

            </div>
        </div>
    </main>

    <script src="/js/member-checkin.js"></script>
</body>
</html>
